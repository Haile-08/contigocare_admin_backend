# Shared security headers for admin.contigo.care.
# Install as /etc/nginx/snippets/cc-admin-security-headers.conf.
#
# nginx `add_header` is NOT inherited into a location block that declares its
# own `add_header` (the Cache-Control locations in the site config do), so
# every such block re-includes this snippet.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# require-corp is safe here: every subresource is same-origin (locked by the
# CSP below) and data: URIs are exempt.
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# CSP for the Vite/React SPA.
#
# style-src 'self': Tailwind v4 compiles to one external stylesheet, the app
# ships no <style> elements, and React `style={{}}` props are applied through
# CSSOM — which CSP does not govern. Recharts is the same.
#
# img-src data: is required: the MFA enrolment QR is a server-rendered SVG that
# the console renders as `<img src="data:image/svg+xml,...">`.
#
# connect-src 'self': the browser only ever talks to its own origin — nginx
# proxies /api to the backend, so there is no cross-origin XHR to allow.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
