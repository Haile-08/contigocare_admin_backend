# Rate-limit zones for the ContigoCare admin API.
# Install as /etc/nginx/conf.d/cc-admin-rate-limit.conf — conf.d files load
# inside the http{} context, which is where limit_req_zone must live.
#
# The `cc_` prefix matters: zone names are global to nginx, so a generic
# `zone=auth` would collide with another site on the same box (e.g.
# agent.contigo.care) and nginx would refuse to start.
#
# cc_auth: brute-force protection for login / MFA / password-reset — 5 req/min per IP.
# cc_api:  general API ceiling — 30 req/s per IP.
limit_req_zone $binary_remote_addr zone=cc_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cc_api:10m rate=30r/s;
