# Hardened nginx site config for admin.contigo.care.
#
# Install as /etc/nginx/sites-available/admin.contigo.care (symlinked into
# sites-enabled), together with:
#   conf.d/cc-admin-rate-limit.conf        — the cc_auth / cc_api zones
#   snippets/cc-admin-security-headers.conf — the shared security headers
#
# Also set `server_tokens off;` in the http{} block of /etc/nginx/nginx.conf:
# the copy below only covers this server block, and responses generated before
# vhost selection still leak the nginx version.
#
# Requires a certificate for the hostname:
#   certbot certonly --webroot -w /var/www/html -d admin.contigo.care

server {
    server_name admin.contigo.care;

    # MAX_UPLOAD_BYTES is 15 MiB; leave headroom for the multipart envelope.
    client_max_body_size 16m;
    server_tokens off;

    root /var/www/contigocare-admin;
    index index.html;

    # ---- Security headers (on every response, including proxied ones) ----
    include snippets/cc-admin-security-headers.conf;

    # Never serve dotfiles (.env, .git, ...) that end up under the web root.
    location ~ /\. {
        deny all;
    }

    # ---- 1. The SPA -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 1a. The SPA shell must always be revalidated. Without this, browsers
    # cache it heuristically and users stay pinned to an old bundle after a
    # deploy. Matches direct hits and the try_files fallback.
    location = /index.html {
        include snippets/cc-admin-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 1b. Vite emits content-hashed filenames under /assets/, so they can be
    # cached forever.
    location /assets/ {
        include snippets/cc-admin-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 1c. Small non-hashed static files: give them an explicit lifetime so
    # caches don't fall back to the RFC 7234 heuristic.
    location ~ ^/(robots\.txt|icon\.svg|favicon\.svg)$ {
        include snippets/cc-admin-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---- 2. The API -------------------------------------------------------

    # 2a. Ops/debug surfaces must not be reachable through the proxy, even if
    # the app is misconfigured with DEBUG=true and re-enables them.
    location ~ ^/(metrics|docs|redoc)$ {
        return 404;
    }
    location = /api/v1/openapi.json {
        return 404;
    }

    # The FastAPI SecurityHeadersMiddleware sets these too. Hide the upstream
    # copies so API responses don't carry duplicate (RFC 6797 non-compliant)
    # headers; the nginx copies above take their place. Upstream
    # `Cache-Control: no-store` is intentionally NOT hidden — analysis
    # responses carry policy text and must never be cached.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Content-Security-Policy;

    # 2b. Credential endpoints get the strict brute-force zone.
    #
    # A regex location beats a prefix location in nginx, so this wins over
    # `location /api/` below. It deliberately does NOT cover /auth/refresh,
    # /auth/logout or /auth/me: a signed-in operator refreshes every 15
    # minutes and would otherwise trip a 5-per-minute limit.
    location ~ ^/api/v1/auth/(login|mfa/|password/) {
        include snippets/cc-admin-security-headers.conf;
        limit_req zone=cc_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2c. Everything else on the API.
    #
    # No trailing path on proxy_pass, so the full /api/v1/... URI is passed
    # through unchanged — the app already serves under /api/v1.
    location /api/ {
        limit_req zone=cc_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR on a 60-page scanned policy plus a Gemini round trip runs well
        # past nginx's 60s default. The browser's own budget is 120s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Policy uploads stream straight to the app instead of being spooled
        # to a temp file on disk — this service is built never to write a
        # policy to disk, and buffering would do exactly that.
        proxy_request_buffering off;
    }

    # ---- 3. TLS -----------------------------------------------------------
    # Ubuntu 24.04 ships nginx 1.24, where http2 is a `listen` flag. On 1.25+
    # this becomes `listen 443 ssl;` plus a separate `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/admin.contigo.care/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.contigo.care/privkey.pem; # managed by Certbot

    # Explicit TLS settings (Mozilla "intermediate") instead of certbot's
    # options-ssl-nginx.conf, which on older certbot still ships TLS 1.0/1.1.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CCADMINSSL:10m;
    ssl_session_tickets off;
    # No ssl_dhparam: the cipher list is ECDHE-only, so DH params are unused.
    # No OCSP stapling: Let's Encrypt retired OCSP in 2025 and its current
    # intermediates carry no responder URL, so stapling can fetch nothing.
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.contigo.care;

    # Let certbot renew over HTTP-01 without touching this file again.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else goes to https.
    location / {
        return 301 https://$host$request_uri;
    }
}
