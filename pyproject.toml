[project]
name = "contigocare-admin-backend"
version = "2.0.0"
description = "ContigoCare insurance policy analysis console — admin API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web
    "fastapi>=0.121.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "asgi-correlation-id>=4.3.4",
    "uvloop>=0.22.1; platform_system != 'Windows'",
    # Agent + model. langchain-google-genai replaces langchain-openai; the agent
    # talks to Gemini only.
    "langchain>=1.0.5",
    "langchain-core>=1.0.4",
    "langchain-google-genai>=2.1.0",
    "langgraph>=1.0.2",
    "langfuse==3.9.1",
    "tenacity>=9.1.2",
    # Persistence. psycopg3 in async mode; psycopg2 is gone with the sync engine.
    "sqlmodel>=0.0.25",
    "psycopg[binary,pool]>=3.3.2",
    "alembic>=1.18.4",
    # Auth. pyotp + qrcode drive Google Authenticator enrolment; cryptography
    # encrypts the TOTP seed at rest.
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=4.3.0",
    "cryptography>=44.0.0",
    "pyotp>=2.9.0",
    "qrcode>=8.0",
    # Password-reset mail. stdlib smtplib is synchronous and would block the
    # event loop for the length of an SMTP conversation — which is a network
    # round trip to a third party, not a local call.
    "aiosmtplib>=5.1.2",
    # Document intake. pypdfium2 is permissively licensed (unlike PyMuPDF's
    # AGPL) and both extracts text and rasterises pages for OCR, so there is no
    # separate poppler dependency.
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.13",
    "pillow>=11.0.0",
    # Shared
    "pydantic[email]>=2.11.1",
    "email-validator>=2.2.0",
    "python-dotenv>=1.1.0",
    "structlog>=25.2.0",
    "prometheus-client>=0.19.0",
    "starlette-prometheus>=0.7.0",
    "tqdm>=4.67.1",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "ruff",
    "djlint==1.36.4",
    "pyinstrument>=5.1.2",
]
cache = [
    "redis>=7.4.0",
    "valkey[libvalkey]>=6.1.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    "pyright>=1.1.390",
    "ruff>=0.11.4",
]
test = ["httpx>=0.28.1", "pytest>=8.3.5"]


[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.black]
line-length = 119
exclude = "venv|migrations"

[tool.flake8]
docstring-convention = "all"
ignore = ["D107", "D212", "E501", "W503", "W605", "D203", "D100"]
exclude = "venv|migrations"
max-line-length = 119

# radon
radon-max-cc = 10

[tool.isort]
profile = "black"
multi_line_output = "VERTICAL_HANGING_INDENT"
force_grid_wrap = 2
line_length = 119
skip = ["migrations", "venv"]

[tool.pylint."messages control"]
disable = [
    "line-too-long",
    "trailing-whitespace",
    "missing-function-docstring",
    "consider-using-f-string",
    "import-error",
    "too-few-public-methods",
    "redefined-outer-name",
]

[tool.pylint.master]
ignore = "migrations"

[tool.ruff]
line-length = 119
exclude = ["migrations", "*.ipynb", "venv"]

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules and docstring (`D`) rules
select = ["E", "F", "B", "ERA", "D"]
# Never enforce `E501` (line length violations).
ignore = ["E501", "D203", "D213", "B904", "B008"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ignore `E402` (import violations) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.pyright]
include = ["app", "evals"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "alembic/versions",
    "migrations",
    "venv",
]
stubPath = "typings"
pythonVersion = "3.13"
typeCheckingMode = "standard"

# Tightened from defaults — cheap real-bug catchers
reportDuplicateImport = "error"
reportInvalidTypeVarUse = "error"
reportSelfClsParameterName = "error"

# Style nudges
reportImplicitOverride = "warning"
